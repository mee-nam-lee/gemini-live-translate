<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>로그인 · Gemini Live Translate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20261013i" />
</head>
<body class="login-body">
  <div class="google-color-bar" aria-hidden="true">
    <span class="g-blue"></span>
    <span class="g-red"></span>
    <span class="g-yellow"></span>
    <span class="g-green"></span>
  </div>

  <main class="login-shell">
    <form class="login-card" id="loginForm" autocomplete="off" novalidate>
      <div class="brand-group login-brand">
        <div class="brand-logo" aria-hidden="true">
          <span class="material-symbols-outlined">translate</span>
        </div>
        <h1 class="brand-heading">Gemini Live Translate</h1>
      </div>

      <p class="login-desc">서비스를 이용하려면 접속 비밀번호를 입력하세요.</p>

      <label class="login-field">
        <span class="login-label">접속 비밀번호</span>
        <span class="login-input-wrap">
          <span class="material-symbols-outlined login-input-icon" aria-hidden="true">lock</span>
          <input
            type="password"
            id="passwordInput"
            name="password"
            class="login-input"
            placeholder="비밀번호"
            autocomplete="current-password"
            autofocus
            required
          />
          <button type="button" class="login-eye" id="btnTogglePw" aria-label="비밀번호 표시">
            <span class="material-symbols-outlined">visibility</span>
          </button>
        </span>
      </label>

      <p class="login-error" id="loginError" role="alert" hidden></p>

      <button type="submit" class="btn btn-primary-mic login-submit" id="btnLogin">
        <span class="material-symbols-outlined" id="loginIcon">login</span>
        <span id="loginLabel">로그인</span>
      </button>
    </form>
  </main>

  <script>
    (function () {
      const form = document.getElementById("loginForm");
      const input = document.getElementById("passwordInput");
      const errorEl = document.getElementById("loginError");
      const btn = document.getElementById("btnLogin");
      const label = document.getElementById("loginLabel");
      const icon = document.getElementById("loginIcon");
      const eye = document.getElementById("btnTogglePw");

      eye.addEventListener("click", () => {
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        eye.querySelector("span").textContent = show ? "visibility_off" : "visibility";
        input.focus();
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
        input.classList.add("is-invalid");
        input.select();
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = input.value.trim();
        if (!password) {
          showError("비밀번호를 입력하세요.");
          return;
        }
        errorEl.hidden = true;
        input.classList.remove("is-invalid");
        btn.disabled = true;
        label.textContent = "확인 중...";
        icon.textContent = "hourglass_top";

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ password }),
          });
          if (res.ok) {
            window.location.replace("/");
            return;
          }
          let detail = "비밀번호가 올바르지 않습니다.";
          try { detail = (await res.json()).detail || detail; } catch (_) {}
          showError(detail);
        } catch (_) {
          showError("서버에 연결할 수 없습니다. 잠시 후 다시 시도하세요.");
        } finally {
          btn.disabled = false;
          label.textContent = "로그인";
          icon.textContent = "login";
        }
      });
    })();
  </script>
</body>
</html>
