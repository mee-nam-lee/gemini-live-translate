<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Gemini Live Translate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=20261017c" />
</head>
<body>
  <!-- Google 4-Color Signature Top Bar -->
  <div class="google-color-bar" aria-hidden="true">
    <span class="g-blue"></span>
    <span class="g-red"></span>
    <span class="g-yellow"></span>
    <span class="g-green"></span>
  </div>

  <div class="app-shell">
    <!-- Top Header (Clean minimal brand + action buttons) -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">
          <span class="material-symbols-outlined" aria-hidden="true">translate</span>
        </div>
        <h1 class="brand-heading">Gemini Live Translate</h1>
      </div>

      <div class="header-actions">
        <!-- Session Status Pill -->
        <div class="session-status-pill" id="sessionStatusPill" data-state="idle">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="sessionStatusText" role="status" aria-live="polite">대기 중</span>
          <span id="sessionTimer" class="session-timer" hidden>00:00</span>
        </div>

        <!-- Direct Meeting Summary (.md) Button -->
        <button type="button" class="btn btn-tonal btn-yellow" id="btnSummary" title="대화 내용을 AI 회의록으로 요약하여 .md 파일로 바로 저장합니다" aria-label="AI 회의 요약 (.md 저장)">
          <span class="material-symbols-outlined" id="summaryBtnIcon" aria-hidden="true">auto_awesome</span>
          <span class="btn-label" id="summaryBtnLabel">회의 요약</span>
        </button>

        <!-- Direct Save Source / Target (.md) Button -->
        <button type="button" class="btn btn-tonal btn-green" id="btnOpenDownload" title="전체 원문(Source)과 전체 번역문(Target)을 분리하여 .md 파일로 바로 저장합니다" aria-label="원문/번역문 저장 (.md)">
          <span class="material-symbols-outlined" aria-hidden="true">download</span>
          <span class="btn-label">원문/번역문 저장</span>
        </button>

        <!-- Clear Button -->
        <button type="button" class="btn btn-icon-only" id="btnClear" title="대화 기록 초기화" aria-label="대화 기록 초기화">
          <span class="material-symbols-outlined" aria-hidden="true">delete_sweep</span>
        </button>
      </div>
    </header>

    <!-- Language & Audio Control Bar (Single Smart Mic, no input dropdown) -->
    <section class="control-bar" aria-label="언어 및 오디오 제어">
      <div class="lang-selector-group">
        <div class="lang-box source-lang-box">
          <label for="sourceLangSelect" class="lang-label">
            <span class="lang-dot blue"></span>
            <span class="lang-label-text">Source <span class="lang-word-optional">Language</span></span>
            <span id="detectedLangChip" class="detected-chip" hidden>감지: -</span>
          </label>
          <div class="select-wrap">
            <select id="sourceLangSelect" class="lang-select">
              <!-- Placeholder: app.js populates the full official list (DEFAULT_SUPPORTED_LANGUAGES, then /api/config) on boot -->
              <option value="en" selected>영어 (English · en)</option>
            </select>
            <span class="material-symbols-outlined select-chevron" aria-hidden="true">expand_more</span>
          </div>
        </div>

        <button type="button" class="swap-btn" id="btnSwapLang" title="Source ↔ Target 언어 전환" aria-label="Source와 Target 언어 전환">
          <span class="material-symbols-outlined" aria-hidden="true">swap_horiz</span>
        </button>

        <div class="lang-box target-lang-box">
          <label for="targetLangSelect" class="lang-label">
            <span class="lang-dot green"></span>
            Target Language
          </label>
          <div class="select-wrap">
            <select id="targetLangSelect" class="lang-select">
              <option value="ko" selected>한국어 (Korean · ko)</option>
            </select>
            <span class="material-symbols-outlined select-chevron" aria-hidden="true">expand_more</span>
          </div>
        </div>
      </div>

      <div class="audio-controls-group">
        <!-- Desktop-only Audio Input Source Selector: "주변 소리 (내장 마이크)" vs "PC 오디오" (Hidden on iPhone / Mobile) -->
        <div
          class="desktop-source-segment"
          id="desktopSourceSegment"
          role="group"
          aria-label="오디오 입력 소스 선택"
          hidden
        >
          <button
            type="button"
            class="source-seg-btn"
            id="btnSourceMic"
            data-source="mic"
            data-active="true"
            aria-pressed="true"
            title="데스크탑 외부 주변/회의실 발화를 내장 마이크로 수음합니다."
          >
            <span class="material-symbols-outlined" aria-hidden="true">mic</span>
            <span>주변 소리</span>
          </button>
          <button
            type="button"
            class="source-seg-btn"
            id="btnSourceDesktop"
            data-source="desktop"
            data-active="false"
            aria-pressed="false"
            title="동일 데스크탑에서 재생되는 오디오(Chrome 탭, QuickTime Player 등)만 직접 수음합니다."
          >
            <span class="material-symbols-outlined" id="desktopAudioIcon" aria-hidden="true">desktop_windows</span>
            <span id="desktopAudioText">PC 오디오</span>
          </button>
        </div>

        <!-- Translated Audio Output Toggle ("번역 음성 듣기") -->
        <label
          class="audio-output-toggle"
          id="audioOutputToggleLabel"
          for="toggleAudioOutput"
          data-active="false"
          title="번역된 음성을 실시간 재생합니다. 이어폰(AirPods 등) 사용을 권장하며, 이어폰 없이 스피커로 재생하면 되울림 방지를 위해 echoCancellation이 자동으로 켜집니다."
        >
          <span class="material-symbols-outlined" id="audioOutputIcon" aria-hidden="true">volume_off</span>
          <span class="audio-output-text">번역 음성 듣기</span>
          <input
            id="toggleAudioOutput"
            type="checkbox"
            switch
            aria-label="번역 음성 듣기"
          />
        </label>

        <!-- Primary Start / Stop Microphone Button -->
        <button type="button" class="btn btn-primary-mic" id="btnToggleMic" data-recording="false">
          <span class="material-symbols-outlined" id="micIcon" aria-hidden="true">mic</span>
          <span id="micBtnText">통역 시작</span>
          <span class="audio-bars" id="audioBars" hidden aria-hidden="true">
            <i class="bar b1"></i>
            <i class="bar b2"></i>
            <i class="bar b3"></i>
            <i class="bar b4"></i>
          </span>
        </button>
      </div>
    </section>

    <!-- Main Split Stage: Top (Collapsible Source) / Bottom (Expandable Target) -->
    <main class="split-stage" id="splitStage">
      <!-- TOP PANEL: Source (Collapsible) -->
      <section class="transcript-panel source-panel" id="sourcePanel" aria-labelledby="sourcePanelTitle">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-indicator blue"></span>
            <h2 id="sourcePanelTitle">Source</h2>
            <span class="lang-tag blue-tag" id="sourcePanelLangTag">영어 (en)</span>
            <span class="collapsed-preview" id="sourceCollapsedPreview" hidden></span>
          </div>
          <div class="panel-actions">
            <span class="latency-badge blue-latency" id="sourceLatencyBadge" title="오디오 입력 이후 원문 텍스트가 아직 나오지 않은 시간 (실시간 갱신)" hidden>
              <span class="material-symbols-outlined" aria-hidden="true">timer</span>
              <span id="sourceLatencyValue">-</span>
            </span>
            <span class="count-badge" id="sourceCountBadge">0문장</span>
            <button type="button" class="panel-action-btn" id="btnCopySource" title="Source 텍스트 전체 복사" aria-label="Source 텍스트 전체 복사">
              <span class="material-symbols-outlined" aria-hidden="true">content_copy</span>
              <span class="action-btn-label">복사</span>
            </button>
            <button
              type="button"
              class="panel-action-btn collapse-toggle-btn"
              id="btnToggleSourceCollapse"
              aria-expanded="true"
              aria-controls="sourceScrollArea"
              aria-label="Source 영역 접기 / 펼치기"
              title="Source 영역 접기 / 펼치기 (접으면 Target이 넓어집니다)"
            >
              <span class="material-symbols-outlined" id="sourceCollapseIcon" aria-hidden="true">unfold_less</span>
              <span class="action-btn-label" id="sourceCollapseLabel">접기</span>
            </button>
          </div>
        </div>

        <div class="transcript-scroll-area" id="sourceScrollArea" role="log" aria-live="off" aria-label="Source 원문 기록" tabindex="0">
          <div class="empty-state" id="sourceEmptyState">
            <span class="material-symbols-outlined empty-icon blue-icon" aria-hidden="true">graphic_eq</span>
            <p class="empty-title">마이크를 켜고 말씀해 주세요</p>
            <p class="empty-desc">입력되는 음성이 실시간으로 인식되어 문장별로 줄바꿈되어 표시됩니다.</p>
          </div>
          <div class="utterance-list" id="sourceUtteranceList"></div>
          <button type="button" class="jump-latest-btn" id="btnJumpSourceLatest" hidden>
            <span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span>
            <span>최신 문장</span>
          </button>
        </div>
      </section>

      <!-- BOTTOM PANEL: Target (Expands when Source is collapsed) -->
      <section class="transcript-panel target-panel" id="targetPanel" aria-labelledby="targetPanelTitle">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-indicator green"></span>
            <h2 id="targetPanelTitle">Target</h2>
            <span class="lang-tag green-tag" id="targetPanelLangTag">한국어 (ko)</span>
          </div>
          <div class="panel-actions">
            <span class="latency-badge green-latency" id="targetLatencyBadge" title="오디오 입력 이후 번역 텍스트가 아직 나오지 않은 시간 (끝에서 끝까지, 실시간 갱신)" hidden>
              <span class="material-symbols-outlined" aria-hidden="true">timer</span>
              <span id="targetLatencyValue">-</span>
            </span>
            <span class="count-badge" id="targetCountBadge">0문장</span>
            <button type="button" class="panel-action-btn" id="btnCopyTarget" title="Target 번역 텍스트 전체 복사" aria-label="Target 번역 텍스트 전체 복사">
              <span class="material-symbols-outlined" aria-hidden="true">content_copy</span>
              <span class="action-btn-label">복사</span>
            </button>
          </div>
        </div>

        <div class="transcript-scroll-area" id="targetScrollArea" role="log" aria-live="off" aria-label="Target 번역 기록" tabindex="0">
          <div class="empty-state" id="targetEmptyState">
            <span class="material-symbols-outlined empty-icon green-icon" aria-hidden="true">translate</span>
            <p class="empty-title">실시간 번역 결과가 이곳에 표시됩니다</p>
            <p class="empty-desc">Source를 접으면 번역 화면을 더욱 넓고 크게 볼 수 있습니다.</p>
          </div>
          <div class="utterance-list" id="targetUtteranceList"></div>
          <button type="button" class="jump-latest-btn green" id="btnJumpTargetLatest" hidden>
            <span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span>
            <span>최신 문장</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Bottom Status Footer (Small gray status line below Target Text box) -->
    <footer class="app-footer" id="appFooter">
      <div id="toastMessage" class="toast-snackbar" role="status" aria-live="polite" hidden></div>
      <div id="srAnnouncer" class="sr-only" aria-live="polite" aria-atomic="false"></div>
    </footer>
  </div>

  <script src="/static/app.js?v=20261017c" defer></script>
</body>
</html>
