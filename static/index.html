<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Gemini Live Translate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet" />

<body>
  <!-- Google 4-Color Signature Top Bar -->
  <div class="google-color-bar" aria-hidden="true">
    <span class="g-blue"></span>
    <span class="g-red"></span>
    <span class="g-yellow"></span>
    <span class="g-green"></span>
  </div>

  <div class="app-shell">
    <!-- Top Header (Clean minimal brand + action buttons) -->
    <header class="app-header">
      <div class="brand-group">
        <div class="brand-logo" aria-hidden="true">
          <span class="material-symbols-outlined">translate</span>
        </div>
        <h1 class="brand-heading">Gemini Live Translate</h1>
      </div>

      <div class="header-actions">
        <!-- Session Status Pill -->
        <div class="session-status-pill" id="sessionStatusPill" data-state="idle">
          <span class="status-dot"></span>
          <span id="sessionStatusText">대기 중</span>
          <span id="sessionTimer" class="session-timer" hidden>00:00</span>
        </div>

        <!-- Direct Meeting Summary (.md) Button -->
        <button type="button" class="btn btn-tonal btn-yellow" id="btnSummary" title="대화 내용을 AI 회의록으로 요약하여 .md 파일로 바로 저장합니다">
          <span class="material-symbols-outlined" id="summaryBtnIcon">auto_awesome</span>
          <span class="btn-label" id="summaryBtnLabel">회의 요약</span>
        </button>

        <!-- Direct Save Source / Target (.txt) Button -->
        <button type="button" class="btn btn-tonal btn-green" id="btnOpenDownload" title="전체 원문(Source)과 전체 번역문(Target)을 분리하여 .txt 파일로 바로 저장합니다">
          <span class="material-symbols-outlined">download</span>
          <span class="btn-label">원문/번역문 저장</span>
        </button>

        <!-- Clear Button -->
        <button type="button" class="btn btn-icon-only" id="btnClear" title="대화 기록 초기화" aria-label="대화 기록 초기화">
          <span class="material-symbols-outlined">delete_sweep</span>
        </button>

        <!-- Logout Button -->
        <button type="button" class="btn btn-icon-only btn-logout" id="btnLogout" title="로그아웃" aria-label="로그아웃">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

          </div>
        </div>

        <button type="button" class="swap-btn" id="btnSwapLang" title="Source ↔ Target 언어 전환" aria-label="Source와 Target 언어 전환">
          <span class="material-symbols-outlined">swap_horiz</span>
        </button>

        <!-- Primary Start / Stop Microphone Button -->
        <button type="button" class="btn btn-primary-mic" id="btnToggleMic" data-recording="false">
          <span class="material-symbols-outlined" id="micIcon">mic</span>
          <span id="micBtnText">통역 시작</span>
          <span class="audio-bars" id="audioBars" hidden aria-hidden="true">
            <i class="bar b1"></i>
            <i class="bar b2"></i>
            <i class="bar b3"></i>
            <i class="bar b4"></i>
          </span>
        </button>

    <!-- Main Split Stage: Top (Collapsible Source) / Bottom (Expandable Target) -->
    <main class="split-stage" id="splitStage">
      <!-- TOP PANEL: Source (Collapsible) -->
      <section class="transcript-panel source-panel" id="sourcePanel" aria-labelledby="sourcePanelTitle">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-indicator blue"></span>
            <h2 id="sourcePanelTitle">Source</h2>
            <span class="lang-tag blue-tag" id="sourcePanelLangTag">영어 (en)</span>
            <span class="collapsed-preview" id="sourceCollapsedPreview" hidden></span>
          </div>
          <div class="panel-actions">
            <span class="count-badge" id="sourceCountBadge">0문장</span>
            <button type="button" class="panel-action-btn" id="btnCopySource" title="Source 텍스트 전체 복사">
              <span class="material-symbols-outlined">content_copy</span>
              <span class="action-btn-label">복사</span>
            </button>
            <button
              type="button"
              class="panel-action-btn collapse-toggle-btn"
              id="btnToggleSourceCollapse"
              aria-expanded="true"
              aria-controls="sourceScrollArea"
              title="Source 영역 접기 / 펼치기 (접으면 Target이 넓어집니다)"
            >
              <span class="material-symbols-outlined" id="sourceCollapseIcon">unfold_less</span>
              <span class="action-btn-label" id="sourceCollapseLabel">접기</span>
            </button>
          </div>
        </div>

        <div class="transcript-scroll-area" id="sourceScrollArea" role="log" aria-live="polite">
          <div class="empty-state" id="sourceEmptyState">
            <span class="material-symbols-outlined empty-icon blue-icon">graphic_eq</span>
            <p class="empty-title">마이크를 켜고 말씀해 주세요</p>
            <p class="empty-desc">입력되는 음성이 실시간으로 인식되어 문장별로 줄바꿈되어 표시됩니다.</p>
          </div>
          <div class="utterance-list" id="sourceUtteranceList"></div>
          <button type="button" class="jump-latest-btn" id="btnJumpSourceLatest" hidden>
            <span class="material-symbols-outlined">arrow_downward</span>
            <span>최신 문장</span>
          </button>
        </div>
      </section>

      <!-- BOTTOM PANEL: Target (Expands when Source is collapsed) -->
      <section class="transcript-panel target-panel" id="targetPanel" aria-labelledby="targetPanelTitle">
        <div class="panel-header">
          <div class="panel-title-group">
            <span class="panel-indicator green"></span>
            <h2 id="targetPanelTitle">Target</h2>
            <span class="lang-tag green-tag" id="targetPanelLangTag">한국어 (ko)</span>
          </div>
          <div class="panel-actions">
            <span class="count-badge" id="targetCountBadge">0문장</span>
            <button type="button" class="panel-action-btn" id="btnCopyTarget" title="Target 번역 텍스트 전체 복사">
              <span class="material-symbols-outlined">content_copy</span>
              <span class="action-btn-label">복사</span>
            </button>
          </div>
        </div>

        <div class="transcript-scroll-area" id="targetScrollArea" role="log" aria-live="polite">
          <div class="empty-state" id="targetEmptyState">
            <span class="material-symbols-outlined empty-icon green-icon">translate</span>
            <p class="empty-title">실시간 번역 결과가 이곳에 표시됩니다</p>
            <p class="empty-desc">Source를 접으면 번역 화면을 더욱 넓고 크게 볼 수 있습니다.</p>
          </div>
          <div class="utterance-list" id="targetUtteranceList"></div>
          <button type="button" class="jump-latest-btn green" id="btnJumpTargetLatest" hidden>
            <span class="material-symbols-outlined">arrow_downward</span>
            <span>최신 문장</span>
          </button>
        </div>
      </section>

  <!-- Floating Toast Snackbar -->
  <div id="toastMessage" class="toast-snackbar" role="status" aria-live="polite" hidden></div>

  <script src="/static/app.js?v=20261013i" defer></script>

</html>
